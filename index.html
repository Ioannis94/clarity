<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>Clarity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-5 4 4 7-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = JSON.parse((localStorage.getItem('clarity.v1') || localStorage.getItem('ledger.v1')) || '{}').settings; if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme; } catch (e) {}
  </script>
</head>
<body>
  <div id="lock" class="lock" hidden></div>

  <div id="shell" class="shell" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Clarity</span>
      </div>
      <div id="nav" class="nav"></div>
      <div class="sidebar-foot">
        <button type="button" id="lock-now" class="nav-item" hidden></button>
      </div>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    <button type="button" id="fab" class="fab" aria-label="Add transaction" title="Add transaction (N)"></button>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/transactions.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/budgets.js"></script>
  <script src="js/views/investments.js"></script>
  <script src="js/views/recurring.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/views/data.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
